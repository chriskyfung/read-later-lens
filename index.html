<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900 text-slate-100">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instapaper Bookmark Manager</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- SQL.js for WebAssembly SQLite support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <!-- D3.js for visual analytics & concept graphs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

  <!-- Modular app entry (bridges the extracted core/model modules) -->
  <script type="module" src="/src/main.js"></script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .word-cloud-item:hover {
      transform: scale(1.15);
      transition: transform 0.15s ease-in-out;
    }
  </style>
</head>

<body class="h-full flex flex-col font-sans antialiased bg-slate-900 text-slate-100 overflow-hidden">

  <!-- Main Application Body -->
  <div id="appBody" class="flex-1 flex overflow-hidden">

  </div>

  <!-- Script Logic -->
  <script>
    // Global state facade - delegates to the modular core (window.IBM.state,
    // wired up by src/main.js). Getter/setter pairs keep the existing `state.x`
    // call sites working (reads, whole-value assignment, and in-place mutations
    // such as state.selectedIds.add(...)). Access is lazy because this classic
    // script evaluates before the deferred module entry runs.
    const S = () => window.IBM.state;
    const state = {
      get bookmarks() { return S().bookmarks; },
      set bookmarks(v) { S().setBookmarks(v); },
      get sourceFiles() { return S().sourceFiles; },
      set sourceFiles(v) { S().setSourceFiles(v); },
      get activeFolder() { return S().activeFolder; },
      set activeFolder(v) { S().setActiveFolder(v); },
      get activeLang() { return S().activeLang; },
      set activeLang(v) { S().setActiveLang(v); },
      get activeTag() { return S().activeTag; },
      set activeTag(v) { S().setActiveTag(v); },
      get activeTab() { return S().activeTab; },
      set activeTab(v) { S().setActiveTab(v); },
      get searchQuery() { return S().searchQuery; },
      set searchQuery(v) { S().setSearchQuery(v); },
      get sortBy() { return S().sortBy; },
      set sortBy(v) { S().setSortBy(v); },
      get selectedIds() { return S().selectedIds; },
      set selectedIds(v) { S().setSelectedIds(v); },
      get SQL() { return S().SQL; },
      set SQL(v) { S().setSQL(v); }
    };

    // D3 zoom/pan state now lives in src/views/linkage.js.

    // ------------------------------------------------------------------
    // IndexedDB persistence now lives in src/core/store.js (bridged via
    // window.IBM). These thin wrappers keep every existing call site working
    // and reproduce the monolith's UI side-effects exactly.
    // ------------------------------------------------------------------

    // Storage usage indicator now lives in src/views/sidebarActions.js.
    async function updateStorageUsageUI() {
      return window.IBM.updateStorageUsageUI();
    }

    async function saveStateToIndexedDB() {
      await window.IBM.saveState();
      await updateStorageUsageUI();
    }

    async function loadStateFromIndexedDB() {
      const restored = await window.IBM.loadState();
      await updateStorageUsageUI();
      if (restored) {
        renderAll();
        showToast(`已成功從 IndexedDB 快取復原 ${state.bookmarks.length} 筆書籤`);
      }
    }

    // DOM helpers now live in src/utils/dom.js (bridged via window.IBM).
    function showToast(msg) {
      return window.IBM.showToast(msg);
    }

    // detectLanguage now lives in src/analytics/detectLanguage.js (bridged via window.IBM).

    // Tokenization/analytics (stopwords, simpleStem, tokenizeText) now live in
    // src/analytics/* (bridged via window.IBM / used by the analytics modules).


    // Filtering & sorting now live in src/core/filters.js (bridged via window.IBM).
    function getFilteredBookmarks() {
      return window.IBM.getFilteredBookmarks();
    }

    // The render orchestrator and sidebar renderers now live in src/views.
    // Keep inline call sites working through the module-owned bridge in src/main.js.
    function renderAll() {
      return window.IBM.renderAll();
    }

    // Window Load / Initialization — cache restore is the last inline duty;
    // all listener wiring lives in src/views/* and src/io/*.
    window.addEventListener('DOMContentLoaded', async () => {
      await loadStateFromIndexedDB();
    });
  </script>
</body>

</html>
