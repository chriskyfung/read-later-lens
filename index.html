<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900 text-slate-100">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Later Lens — 稍後閱讀透鏡</title>

  <!-- Modular app entry (bridges the extracted core/model modules) -->
  <script type="module" src="/src/main.js"></script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .word-cloud-item:hover {
      transform: scale(1.15);
      transition: transform 0.15s ease-in-out;
    }
  </style>
</head>

<body class="h-full flex flex-col font-sans antialiased bg-slate-900 text-slate-100 overflow-hidden">

  <!-- Main Application Body -->
  <div id="appBody" class="flex-1 flex overflow-hidden">

  </div>

</body>

</html>
